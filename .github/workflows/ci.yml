name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test isolated relay and account flows
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          node --check static/muse-setup.js
          node --test tests/test_setup_prompt.cjs
          node --check static/muse-test.js
          node --test tests/test_onboarding.cjs
          node --check static/muse.js
          node --check static/app.js
      - name: Build server image
        if: matrix.python == '3.13'
        run: docker build --tag muse-relay:test .
      - name: Verify running container
        if: matrix.python == '3.13'
        run: |
          docker run --detach --rm --name muse-relay-ci \
            --publish 127.0.0.1:18080:8080 \
            --env PRODUCER_TOKEN=ci-only-producer \
            --env CONSUMER_TOKEN=ci-only-consumer \
            --env PUBLIC_SEND=true \
            --env PUBLIC_ORIGIN=http://127.0.0.1:18080 \
            muse-relay:test
          trap 'docker logs muse-relay-ci; docker stop muse-relay-ci' EXIT
          python scripts/check_container.py
